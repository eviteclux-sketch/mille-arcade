</div>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
// ---------- game rules (ported 1:1 from @workspace/game-rules) ----------
const OLD_IDS=["tangent_shot","ghost_fit","ripple_lock","time","circle","gap","stop","match","lead_drop","needle","blind_zero"];
const GAME_IDS=["tangent_shot","brake","ghost_fit","split","ripple_lock","drop","time","gravity","circle","ribbon","gap","stop","match","lead_drop","needle","blind_zero"];
const LAB_IDS=new Set(["brake","split","drop","gravity","ribbon"]);
const R={
 time:{label:"COUNTER TARGET",unit:"ms",strict:45,min:18,assist:10,tighten:6,lvl:3,maxAssist:60,range:1000,instruction:"TAP ON THE TARGET DIGIT"},
 circle:{label:"LOCK DIAL",unit:"deg",strict:12,min:5,assist:3,tighten:2,lvl:1,maxAssist:18,range:120,instruction:"LOCK THE DIAL"},
 gap:{label:"VISIBLE CUT",unit:"px",strict:11,min:4,assist:3,tighten:2,lvl:1,maxAssist:18,range:160,instruction:"CUT THE STACK"},
 stop:{label:"DROP GAP",unit:"px",strict:10,min:4,assist:3,tighten:2,lvl:1,maxAssist:18,range:150,instruction:"DROP THROUGH THE GAP"},
 match:{label:"COLOR GATE",unit:"px",strict:14,min:6,assist:4,tighten:2,lvl:1,maxAssist:24,range:200,instruction:"HIT THE COLOR GATE"},
 lead_drop:{label:"LEAD DROP",unit:"px",strict:9,min:3,assist:2,tighten:1,lvl:.5,maxAssist:14,range:110,instruction:"DROP ON THE CENTER"},
 needle:{label:"NEEDLE",unit:"px",strict:7,min:2,assist:2,tighten:1,lvl:.5,maxAssist:12,range:90,instruction:"FIND THE NARROW ZONE"},
 tangent_shot:{label:"TANGENT SHOT",unit:"px",strict:8,min:3,assist:2,tighten:1,lvl:.5,maxAssist:14,range:82,instruction:"FIRE THROUGH THE TARGET"},
 ghost_fit:{label:"GHOST FIT",unit:"px",strict:6,min:2,assist:2,tighten:1,lvl:.5,maxAssist:12,range:46,instruction:"MATCH THE GHOST"},
 ripple_lock:{label:"RIPPLE LOCK",unit:"px",strict:7,min:2,assist:2,tighten:1,lvl:.5,maxAssist:13,range:74,instruction:"SEND THE RIPPLE INTO THE LOCK"},
 brake:{label:"BRAKE PERFECT",unit:"px",strict:35,min:10,assist:0,tighten:0,lvl:0,maxAssist:0,range:200,instruction:"STOP THE BALL ON THE TARGET"},
 split:{label:"SPLIT FLASH",unit:"%",strict:3,min:1,assist:0,tighten:0,lvl:0,maxAssist:0,range:50,instruction:"CUT THE SHAPE 50 / 50"},
 drop:{label:"LAST DROP",unit:"%",strict:4,min:1,assist:0,tighten:0,lvl:0,maxAssist:0,range:100,instruction:"FILL TO THE LINE"},
 gravity:{label:"GRAVITY SEAM",unit:"px",strict:34,min:10,assist:0,tighten:0,lvl:0,maxAssist:0,range:150,instruction:"FLIP GRAVITY THROUGH THE SLIT"},
 ribbon:{label:"RIBBON LIMIT",unit:"px",strict:10,min:2,assist:0,tighten:0,lvl:0,maxAssist:0,range:150,instruction:"LAY THE RIBBON ON THE BAND"},
 blind_zero:{label:"BLIND ZERO",unit:"ms",strict:55,min:20,assist:10,tighten:6,lvl:5,maxAssist:65,range:1250,instruction:"TAP AS CLOSE TO 0.00 AS POSSIBLE"}
};
const HELP={
 tangent_shot:["TOUCHE QUAND LE POINT BLANC TRAVERSE L’ANNEAU VERT.","Réussi : le centre du point passe dans l’anneau."],
 ghost_fit:["TOUCHE QUAND LA FORME PLEINE RECOUVRE LE FANTÔME.","Réussi : même taille et même angle."],
 ripple_lock:["TOUCHE QUAND L’ONDE BLANCHE ATTEINT LA CIBLE FIXE.","L’onde grandit vers l’extérieur. Réussi : les deux anneaux s’alignent."],
 circle:["TOUCHE QUAND LE REPÈRE MOBILE EST AU CENTRE DE LA CIBLE.","Réussi : les deux repères sont alignés."],
 gap:["TOUCHE QUAND LA LIGNE PASSE EXACTEMENT DANS LA COUPE.","Réussi : la ligne partage l’espace au bon endroit."],
 stop:["TOUCHE POUR LÂCHER LE BLOC DANS L’OUVERTURE.","Anticipe la chute : vise le centre du passage."],
 match:["TOUCHE QUAND LE MARQUEUR ARRIVE SUR LA PORTE DE MÊME COULEUR.","Réussi : marqueur et porte sont superposés."],
 lead_drop:["TOUCHE AVANT LE CENTRE POUR QUE LA CHUTE Y ARRIVE.","Anticipe le délai : le point continue d’avancer."],
 needle:["TOUCHE QUAND LE MARQUEUR ENTRE DANS LA ZONE TRÈS FINE.","Réussi : le marqueur est au centre de la fente."],
 brake:["MAINTIENS POUR FREINER LA BILLE, ARRÊTE-LA AU CENTRE.","Relâche pour laisser rouler, maintiens pour freiner."],
 split:["TAPE QUAND LA LAME COUPE LA FORME EN DEUX MOITIÉS ÉGALES.","Réussi : 50 % / 50 %."],
 drop:["MAINTIENS POUR REMPLIR, RELÂCHE AVANT LA LIGNE.","Les dernières gouttes tombent encore après ton doigt."],
 gravity:["UN SEUL TAP : LA GRAVITÉ S’INVERSE. PASSE PAR LA FENTE.","Tape tôt : le point redescend… puis remonte."],
 ribbon:["TAPE QUAND LE RUBAN EST PILE SUR LA BANDE.","Ce qui dépasse est coupé : la pose suivante est plus étroite."],
 blind_zero:["MÉMORISE LE RYTHME, PUIS TOUCHE AU PLUS PRÈS DE 0.00.","Le compteur disparaît : continue de compter mentalement."]
};
function gameHelp(id,digit){if(id==='time')return digit?[`ATTENDS LE CHIFFRE ${digit}, PUIS TOUCHE.`,`Exemple : touche dès que ${digit} s’affiche.`]:["ATTENDS LE CHIFFRE DEMANDÉ, PUIS TOUCHE.","Exemple : objectif 4 → touche dès que 4 s’affiche."];return HELP[id];}
const CB=10000,CMIN=300,CMAX=1200,CDEF=1000,CD=6;
const encodeCounterTarget=(d,s)=>CB+Math.max(CMIN,Math.min(CMAX,Math.round(s)))*CD+Math.max(1,Math.min(CD,Math.round(d)))-1;
function decodeCounterTarget(t){const p=Math.round(t)-CB,d=((p%CD)+CD)%CD+1,s=Math.floor(p/CD);return p<0||s<CMIN||s>CMAX?{digit:5,stepMs:CDEF}:{digit:d,stepMs:s};}
const counterStepForDifficulty=(tier,f)=>Math.max(CMIN,Math.min(CMAX,CDEF-(Math.max(1,tier)-1)*210+Math.min(2,Math.max(0,f-1))*65));
function counterSnapshot(e,t){const{digit:td,stepMs}=decodeCounterTarget(t),se=Math.max(0,e),w=Math.floor(se/stepMs),digit=(w%CD)+1,pos=se-w*stepMs,precisionMs=Math.abs(pos-stepMs/2);return{digit,targetDigit:td,stepMs,precisionMs,success:digit===td};}
const clampP=p=>Math.max(0,Math.min(2,p));
const progressFor=(e,t)=>clampP(e/t);
const visualOffset=(id,p)=>(clampP(p)-1)*R[id].range;
const LD_DELAY=90,LD_W=[72,72,54,48];
const ldWidth=t=>LD_W[Math.max(0,Math.min(3,Math.round(t)-1))];
const ldCenters=t=>{const w=ldWidth(t);return Array.from({length:7},(_,i)=>(i-3)*w);};
const ldVisual=(e,t)=>progressFor(Math.max(0,e)+LD_DELAY,t);
const TO_R=62,TT_X=128,TI_X=TO_R*TO_R/TT_X,TI_Y=-Math.sqrt(TO_R*TO_R-TI_X*TI_X),TI_A=Math.atan2(TI_Y,TI_X);
function tangentP(p){const a=TI_A+(clampP(p)-1)*(Math.PI/3),ox=Math.cos(a)*TO_R,oy=Math.sin(a)*TO_R,dx=-Math.sin(a),dy=Math.cos(a),tx=TT_X-ox,ty=-oy,cd=Math.max(0,tx*dx+ty*dy),cx=ox+dx*cd,cy=oy+dy*cd,L=Math.max(190,cd+48),err=Math.hypot(cx-TT_X,cy);return{ox,oy,ex:ox+dx*L,ey:oy+dy*L,cx,cy,error:err,signed:Math.sign(clampP(p)-1)*err};}
function ghostP(p,tier){const s=(clampP(p)-1)*R.ghost_fit.range,m=1+Math.max(0,Math.min(3,tier-1))*.08;return{scale:1+s/100,rot:s*.32*m,signed:s,error:Math.abs(s)};}
const RP_DELAY=150,RP_R=72;
function rippleP(p,t){const ip=clampP(p+RP_DELAY/Math.max(1,t)),r=RP_R+(ip-1)*R.ripple_lock.range,s=r-RP_R;return{radius:Math.max(8,r),signed:s,error:Math.abs(s)};}
function mechanicError(id,e,t){
 if(id==='time'){const s=counterSnapshot(e,t);return s.success?s.precisionMs:s.stepMs/2+s.precisionMs+1;}
 if(id==='blind_zero')return Math.abs(e-t);
 if(id==='lead_drop')return Math.abs(visualOffset('lead_drop',ldVisual(e,t)));
 if(id==='tangent_shot')return tangentP(progressFor(e,t)).error;
 if(id==='ghost_fit')return ghostP(progressFor(e,t),1).error;
 if(id==='ripple_lock')return rippleP(progressFor(e,t),t).error;
 return Math.abs(visualOffset(id,progressFor(e,t)));
}
function rating(id,err){if(!isFinite(err))return'MISS';const s=R[id].strict;return err<=Math.max(1,s*.2)?'PERFECT':err<=s?'GREAT':err<=s*2?'GOOD':'MISS';}
const hideLead=t=>[440,390,340,290][Math.max(0,Math.min(3,t-1))];
const strictThr=(id,t)=>Math.max(R[id].min,R[id].strict-(t-1)*R[id].lvl);
const tierTargetMs=t=>[1250,850,620,430][Math.max(0,Math.min(3,t-1))];
const fmt=(v,id,d=1)=>isFinite(v)?`${v.toFixed(R[id].unit==='ms'||R[id].unit==='%'?2:d)} ${R[id].unit.toUpperCase()}`:'—';
// journey
const JV=12;
const NSTAGE=()=>GAME_IDS.length*3;
const stageOf=s=>s.mechanicIndex*3+Math.min(3,s.tier)-1;
const atStage=(s,n)=>n>=NSTAGE()?{...s,level:s.level+1,mechanicIndex:0,tier:1,tierSuccesses:0,tierAttempts:0,next:null}:{...s,mechanicIndex:Math.floor(n/3),tier:n%3+1,tierSuccesses:0,tierAttempts:0,next:null};
const initJ=()=>({version:JV,level:1,mechanicIndex:0,tier:1,thresholds:GAME_IDS.map(id=>strictThr(id,1)),failures:GAME_IDS.map(()=>0),perfects:GAME_IDS.map(()=>0),tierSuccesses:0,tierAttempts:0,points:0,streak:0,next:null});
function assisted(s,f,th){const c=s.mechanicIndex;f[c]+=1;if(f[c]>=2){const id=GAME_IDS[c];th[c]=Math.min(strictThr(id,s.tier)+R[id].maxAssist,th[c]+R[id].assist);}}
// Journey: each game at 3 speeds (easy, medium, hard; one success each), then the next game. After every 4th game, an optional FRENZY bonus on another game.
function advance(s){if(s.tier===4&&s.next)return{...s,mechanicIndex:s.next.mechanicIndex,tier:s.next.tier,level:s.next.level||s.level,tierSuccesses:0,tierAttempts:0,next:null};return atStage(s,stageOf(s)+1);}
function jFail(s){const f=[...s.failures],th=[...s.thresholds],pf=[...s.perfects];pf[s.mechanicIndex]=0;assisted(s,f,th);const a=s.tierAttempts+1;
 if(s.tier===4&&a>=3)return advance({...s,failures:f,thresholds:th,perfects:pf});
 return{...s,failures:f,thresholds:th,perfects:pf,tierAttempts:a,streak:s.tier===4?s.streak:0};}
function jSuccess(s,err){const f=[...s.failures],th=[...s.thresholds],pf=[...s.perfects],c=s.mechanicIndex,id=GAME_IDS[c];
 if(id==='lead_drop'){pf[c]=err!==undefined&&rating(id,err)==='PERFECT'?pf[c]+1:0;if(pf[c]>=2){th[c]=Math.max(strictThr(id,s.tier),th[c]-R[id].tighten);pf[c]=0;}}
 else th[c]=Math.max(strictThr(id,s.tier),th[c]-R[id].tighten);
 f[c]=0;
 if(s.tier===4)return advance({...s,failures:f,thresholds:th,perfects:pf});
 const pts=s.points+s.tier*100+s.streak*10,st=s.streak+1,cleared=stageOf(s)+1;
 const nx=atStage({...s,failures:f,thresholds:th,perfects:pf,points:pts,streak:st},cleared);
 if(cleared%12===0)return{...s,mechanicIndex:(s.mechanicIndex+8)%GAME_IDS.length,failures:f,thresholds:th,perfects:pf,points:pts,streak:st,tier:4,tierSuccesses:0,tierAttempts:0,next:{mechanicIndex:nx.mechanicIndex,tier:nx.tier,level:nx.level}};
 return nx;}

// ---------- storage ----------

function todayKey(){const d=new Date();return d.getUTCFullYear()+'-'+(d.getUTCMonth()+1)+'-'+d.getUTCDate();}
function dailyCfg(){const k=todayKey();let h=0;for(const ch of k)h=(h*31+ch.charCodeAt(0))>>>0;const ids=GAME_IDS.filter(i=>i!=='time'&&!LAB_IDS.has(i));const id=ids[h%ids.length];return{id,tier:2,targetMs:tierTargetMs(2),thr:strictThr(id,2)};}
function buildRound(){
 let idx,tier,thr;
 if(mode==='daily'){const d=dailyCfg();G={id:d.id,tier:d.tier,targetMs:d.targetMs,thr:d.thr,idx:GAME_IDS.indexOf(d.id)};return;}
 if(mode==='explore'){idx=exploreIndex;tier=1;thr=strictThr(GAME_IDS[idx],1);}
 else if(mode==='challenge'){idx=GAME_IDS.indexOf(CH.g);tier=CH.t;thr=strictThr(GAME_IDS[idx],tier);}
 else{idx=J.mechanicIndex;tier=J.tier;thr=J.thresholds[idx];}
 const id=GAME_IDS[idx];
 const step=counterStepForDifficulty(tier,(mode==='explore'||mode==='challenge')?0:J.failures[idx]);
 const digit=1+((J.level+J.failures[0]+3)%6);
 const targetMs=id==='time'?encodeCounterTarget(digit,step):tierTargetMs(tier);
 G={id,idx,tier,targetMs,thr:id==='time'?step/2:thr};
 if(LAB_IDS.has(id)){const f=(mode==='explore'||mode==='challenge')?0:J.failures[idx];G.lab=true;G.L=Math.min(2,tier-1);G.sp=(1-.1*Math.min(2,Math.max(0,f-2)))*(tier===4?1.12:1);G.assisted=G.sp<1&&tier<4;}
}

 $('inst').textContent=R[id].instruction;
 const p=$('prog');p.style.color=mode==='journey'?C.mfg:C.primary;if(mode==='challenge')p.style.fontSize='12px';else p.style.fontSize='';
 p.textContent=mode==='challenge'?`Score à battre : ${CH.s} / 1000${CH.best!=null?' · ton meilleur : '+CH.best:''}`:mode==='explore'?'Pas de points ni de progression.':mode==='daily'?`Défi du jour • meilleur : ${META.daily[todayKey()]!=null?fmt(META.daily[todayKey()],id):'—'}`:isBonus?`Bonus optionnel • essai ${J.tierAttempts+1}/3`:['','Niveau facile','Niveau moyen','Niveau difficile'][G.tier]+' · une réussite pour avancer';

function finish(fromTap){

 G.score=scoreOf(err,G.thr);G.lifeDelta=0;G.gain=0;
 if(mode==='journey'&&G.tier<4){
  if(passed){G.gain=G.score+10*Math.min(combo,10);META.run=(META.run||0)+G.gain;META.winRow=(META.winRow||0)+1;if(META.winRow%3===0){META.lives++;G.lifeDelta=1;}}

 if(passed)(perfect?SND.perfect:SND.success)();else SND.error();

 // local PB

}
function onTap(){

  if(mode==='journey'&&J.tier<4){META.winRow=0;META.lives=Math.max(0,META.lives-1);G.lifeDelta=-1;saveMeta();}
  if(mode==='journey'){const n=jFail(J);const bonusEnd=J.tier===4&&n.tier!==4;J=n;save();if(bonusEnd){bonusNotice('DOMMAGE, BONUS RATÉ… ON CONTINUE !');return;}}
  setState('EARLY');return;}
 if(state==='RUNNING'){
  if(G.lab){const t=performance.now()-startAt;labG.holding=true;if(LABM[G.id].down)LABM[G.id].down(LS,t,labG);return;}

    if(J.tier===4){J=jSuccess(J,err);save();addLives(3);ev('stage',{game:G.id,tier:4,passed:true});bonusNotice('FRENZY RÉUSSI • +3 ❤️');return;}
    const prevTier=J.tier;J=jSuccess(J,err);save();ev('stage',{game:G.id,tier:prevTier,passed:true});newRound();return;}
   misses++;const wasBonus=J.tier===4;
   const n=jFail(J);const bonusEnd=J.tier===4&&n.tier!==4;J=n;save();
   if(bonusEnd){bonusNotice('DOMMAGE, BONUS RATÉ… ON CONTINUE !');return;}
   if(!wasBonus){showBoard('loss');return;}
   buildRound();buildMech();
  }
  if(state==='EARLY'&&mode==='journey'&&G.tier<4){showBoard('loss');return;}
  begin();
 }
}

  const dlt=elapsed+90-G.targetMs;
  const diff=G.lab?(G.labRes?G.labRes.detail:''):id==='time'?(cs.success?`${cs.precisionMs.toFixed(2)} MS FROM CENTER`:`TARGET WAS ${cs.targetDigit}`):id==='blind_zero'?`${err.toFixed(2)} MS FROM ZERO`:id==='lead_drop'?`${err.toFixed(1)} PX FROM CENTER • ${dlt>.5?'TOO LATE':dlt<-.5?'TOO EARLY':'ON TIME'}`:passed?`${R[id].label} ALIGNED`:`${R[id].label} ALIGNMENT ERROR`;
  const tip=G.lab?(passed?'Bien vu.':'Regarde l’écart et ajuste.')+(G.assisted?' · ASSISTÉ':''):id==='time'?'Vise le centre de la fenêtre du chiffre demandé.':elapsed<G.targetMs?'Essaie un peu plus tard.':elapsed>G.targetMs?'Essaie un peu plus tôt.':'Pile au bon moment.';
  const journey=mode==='journey';
  const cmb=rk==='MISS'?0:combo;
  const label=passed&&journey?'TAP TO CONTINUE':'TAP TO RETRY';
  html=`<div class="vtop">${mode==='explore'?`<div class="rank" style="color:${mfg};font-size:14px">PRACTICE MODE</div>`:''}<div class="rank" style="color:${rc}">${rk}</div><div class="combo" style="color:${cmb>0?fg:mfg}">SCORE <b style="color:${fg};font-size:15px">${G.score||0}</b> / 1000 · COMBO x${cmb}</div><div class="big" style="color:${perfect?prim:fg};font-size:${id==='time'?64:42}px">${bigv}</div><div class="diff" style="color:${perfect?prim:mfg}">${diff}</div>${mode==='journey'&&G.tier<4?`<div class="combo" style="color:${fg};margin-top:6px">PARTIE <b style="font-size:16px">${(META.run||0).toLocaleString('fr-FR')}</b> PTS${G.gain?` <span style="color:${prim}">+${G.gain}</span>`:''} · ❤️ ${META.lives}${G.lifeDelta>0?` <span style="color:${prim}">+1</span>`:G.lifeDelta<0?` <span style="color:${red}">−1</span>`:''}</div>`:''}${mode==='challenge'?`<div class="jo" style="color:${G.score>CH.s?prim:red}">${G.score>CH.s?`TU AS BATTU ${(CH.n||'TON POTE').toUpperCase()} ! (${G.score} CONTRE ${CH.s})`:`ENCORE ${CH.s-G.score+1} POINTS POUR LE BATTRE`}</div>`:''}${journey||mode==='daily'?`<div class="jo" style="color:${passed?prim:red}">${passed?(journey?'PALIER RÉUSSI':'RÉUSSI'):'À RÉESSAYER'}</div>`:''}${(G.score||0)>0?`<button class="sharebtn" id="sharebtn">${mode==='challenge'&&G.score>CH.s?'ENVOIE-LUI LA REVANCHE 📲':'DÉFIER UN POTE 📲'}</button>`:''}</div>
  <div class="vbot"><div class="stat" style="color:${mfg}">${tip}</div>${journey&&id!=='time'&&G.thr>R[id].strict?`<div class="stat" style="color:${mfg}">TOLÉRANCE ÉLARGIE · SCORE BRUT INCHANGÉ</div>`:''}<div class="stat" style="color:${passed?prim:red}">${id==='time'||passed?'PRECISION':'ERROR'}: ${fmt(err,id)} / ${fmt(G.thr,id)}</div>${META.pb[id]!=null?`<div class="stat" style="color:${mfg}">RECORD PERSO : ${fmt(META.pb[id],id)}</div>`:''}<div class="again" style="color:${passed&&journey?prim:fg}">${label}</div></div>`;
 }else{html='';}
 views.innerHTML=html;const sb=$('sharebtn');if(sb)sb.addEventListener('click',e=>{e.stopPropagation();shareChallenge();});
 if(state!=='RUNNING'&&state!=='PREPARING'&&M.lbl)drawMech(performance.now());
}

// ---------- overlays ----------
function overlay(html){$('ovc').innerHTML=html;$('ov').hidden=false;}
function closeOv(){$('ov').hidden=true;}
$('ov').addEventListener('click',e=>{if(e.target.id==='ov')closeOv();});
$('help').addEventListener('click',e=>{e.stopPropagation();const h=gameHelp(G.id,G.id==='time'?decodeCounterTarget(G.targetMs).digit:undefined);overlay(`<div class="eyebrow">COMMENT JOUER ?</div><div class="title" style="padding:0;line-height:31px">${h[0]}</div><div class="ex" style="padding:0;font-size:15px;line-height:22px;margin-top:16px">${h[1]}</div><button class="btnp" data-close>J’AI COMPRIS</button>`);});
$('ovc').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-close'))closeOv();const a=b.dataset.act;if(a)ACT[a]();});
function stuckPanel(){overlay(`<div class="eyebrow">${R[G.id].label}</div><div class="title" style="padding:0">ÉCHEC ${misses} FOIS</div><div class="ex" style="padding:0">Si près… Tu as ${META.jokers} joker${META.jokers>1?'s':''}. Un joker valide ce palier.</div><button class="btnp" data-act="useJoker">UTILISER UN JOKER</button><br><button class="btng" data-act="noJoker">PAS MAINTENANT — CONTINUER</button>`);}
const ACT={
 useJoker(){closeOv();META.jokers--;saveMeta();misses=0;J=jSuccess(J,undefined);save();newRound();},
 noJoker(){closeOv();misses=0;buildRound();buildMech();begin();},
 cont(){closeOv();if(META.lives<=0){showBoard('loss');return;}buildRound();buildMech();begin();},
 shareLives(){shareRun();},
 daily(){closeOv();mode='daily';newRound();},
 journey(){closeOv();mode='journey';exploreIndex=null;newRound();},
 reset(){if(confirm('Remettre le parcours à zéro ?')){J=initJ();save();closeOv();mode='journey';newRound();}},
 snd(){META.sound=!META.sound;saveMeta();ACT.settings();},
 hap(){META.haptics=!META.haptics;saveMeta();ACT.settings();},
 settings(){overlay(`<div class="eyebrow">SETTINGS</div><button class="row" style="width:100%" data-act="snd"><span>Son</span><b>${META.sound?'ON':'OFF'}</b></button><button class="row" style="width:100%" data-act="hap"><span>Vibrations</span><b>${META.haptics?'ON':'OFF'}</b></button><button class="row" style="width:100%" data-act="reset"><span>Recommencer le parcours</span><b>↺</b></button><button class="btnp" data-close>FERMER</button>`);}
};
function setNav(open){const n=$('nav');n.innerHTML='';navOpen=open;if(G)updHud();const add=(t,fn,col)=>{const b=document.createElement('button');b.textContent=t;if(col)b.style.color=col;b.addEventListener('click',e=>{e.stopPropagation();fn();});n.appendChild(b);};
 add(open?'CLOSE':'MENU',()=>setNav(!open));n.firstChild.id='menu';
 if(!open)return;
 add(mode==='journey'?'DAILY':'PARCOURS',()=>{setNav(false);mode==='journey'?ACT.daily():ACT.journey();});
 add('RECORDS',()=>{setNav(false);overlay(`<div class="eyebrow">RECORDS PERSO</div>${GAME_IDS.map(id=>`<div class="row"><span>${R[id].label}</span><b>${META.pb[id]!=null?fmt(META.pb[id],id):'—'}</b></div>`).join('')}<div class="ex" style="padding:0;margin-top:14px">Niveau ${J.level} · ${J.points} points · ${META.plays||0} essais</div><button class="btnp" data-close>FERMER</button>`);},null);
 add('SCORES 🏆',()=>{setNav(false);showBoard('view');},C.primary);
 add('SETTINGS',()=>{setNav(false);ACT.settings();});
 add('16 JEUX ↗',()=>{ev('promo');location.href='https://jeux.eviteclux.com/arcade/?src=1000';},C.primary);
}
$('bskip').addEventListener('click',e=>{e.stopPropagation();J=advance({...J});save();newRound();});
$('bexplore').addEventListener('click',e=>{e.stopPropagation();mode='explore';exploreIndex=(J.mechanicIndex+1)%GAME_IDS.length;newRound();});
$('xnext').addEventListener('click',e=>{e.stopPropagation();exploreIndex=(exploreIndex+1)%GAME_IDS.length;newRound();});
$('xback').addEventListener('click',e=>{e.stopPropagation();ACT.journey();});
$('promo-a').addEventListener('click',()=>ev('promo'));

// input: pointerdown on the surface (not on buttons)
const labUp=()=>{if(G&&G.lab&&labG.holding){labG.holding=false;if(state==='RUNNING'&&LABM[G.id].up)LABM[G.id].up(LS,performance.now()-startAt,labG);}};
$('surface').addEventListener('pointerup',labUp);$('surface').addEventListener('pointercancel',labUp);
$('surface').addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;if(e.button>0)return;e.preventDefault();onTap();});
document.addEventListener('keydown',e=>{if(e.repeat)return;if(e.key===' '||e.key==='Enter'){e.preventDefault();onTap();}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&(state==='RUNNING'||state==='PREPARING')){clearTimeout(prepT);clearTimeout(runT);setState('IDLE');}});

// promo bar height -> push content down
function layout(){const h=$('promo').offsetHeight;$('surface').style.setProperty('--pt',h+'px');}
window.addEventListener('resize',layout);

let labLast=performance.now();
function frame(now){const ldt=Math.min(.05,(now-labLast)/1000);labLast=now;
 if(G&&G.lab&&LS){if(state==='RUNNING'){const t=now-startAt,sub=4;for(let i=0;i<sub&&state==='RUNNING';i++)LABM[G.id].update(LS,t-(sub-1-i)*ldt*1000/sub,ldt/sub,labG);if(state==='RUNNING')LS._t=t;}
  else if(state==='RESULT'&&(G.id==='ribbon'||G.id==='split'))LABM[G.id].update(LS,LS._t||0,ldt,labG);
  drawMech(now);requestAnimationFrame(frame);return;}
 if(G&&(state==='RUNNING'||state==='PREPARING'||(state==='RESULT'&&(G.id==='lead_drop'||showLabel))))drawMech(now);requestAnimationFrame(frame);}

let navOpen=false;
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('on'),1800);}
function updHud(){const on=mode==='journey'&&!navOpen;$('hudL').hidden=$('hudR').hidden=!on;if(!on)return;$('hudL').textContent='❤️ '+META.lives;$('hudR').textContent=(META.run||0).toLocaleString('fr-FR')+' pts';}
function addLives(n){if(META.lives<=0){META.run=0;META.runSubmitted=false;}META.lives+=n;saveMeta();if(G)updHud();}
function grantShare(){const k=todayKey();if(META.shareDay!==k){META.shareDay=k;META.shareCnt=0;}if(META.shareCnt<3){META.shareCnt++;addLives(5);toast('+5 ❤️ merci pour le partage !');return true;}toast('Bonus de partage : 3 par jour max');return false;}
function submitRun(){const sc=META.run||0;if(META.runSubmitted||sc<=0)return;if(!META.name){const n=(prompt('Ton pseudo pour le classement :')||'').trim().slice(0,16);if(n)META.name=n;}
 META.runSubmitted=true;META.lastRun=sc;if(!META.best||sc>META.best)META.best=sc;saveMeta();
 try{fetch(SB.url+'/rest/v1/precision_runs',{method:'POST',headers:{apikey:SB.key,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({player:PID,pseudo:META.name||null,score:Math.min(200000,sc),stage:stageOf(J)+1+(J.level-1)*NSTAGE()}),keepalive:true}).catch(()=>{});}catch(e){}}
function shareRun(){const sc=META.lives<=0?(META.lastRun||0):(META.run||0);const url='https://jeux.eviteclux.com/1000/?src=share';const text=`J'ai fait ${sc.toLocaleString('fr-FR')} points sur 1.000 🎯 Un seul doigt. Tu fais mieux ?`;
 const wasOver=META.lives<=0;const done=()=>{grantShare();if(!$('ov').hidden)showBoard(wasOver&&META.lives>0?'resume':boardKind);};
 if(navigator.share){navigator.share({title:'1.000',text,url}).then(done).catch(()=>{});return;}
 const full=text+' '+url;if(navigator.clipboard)navigator.clipboard.writeText(full).then(()=>{done();window.open('https://wa.me/?text='+encodeURIComponent(full),'_blank');}).catch(()=>{});else{done();location.href='https://wa.me/?text='+encodeURIComponent(full);}}
let boardKind='view';
function showBoard(kind){boardKind=kind;const over=kind==='loss'&&META.lives<=0;if(over)submitRun();
 const run=over?(META.lastRun||0):(META.run||0),best=Math.max(META.best||0,META.run||0);
 const eyebrow=kind==='view'?'CLASSEMENT':kind==='resume'?'C’EST REPARTI · ❤️ +5':over?'PARTIE TERMINÉE':'RATÉ · ❤️ −1';
 const left=META.shareDay===todayKey()?3-(META.shareCnt||0):3;
 const btns=kind==='view'?'<button class="btnp" data-close>FERMER</button>':over?`${left>0?'<button class="btnp" data-act="shareLives">PARTAGER → +5 ❤️</button>':''}<div class="ex" style="padding:0;margin-top:12px">Plus de vies. ${left>0?'Partage pour en récupérer, ou reviens':'Reviens'} demain : ${START_LIVES} ❤️ offertes chaque jour.</div>`:`<button class="btnp" data-act="cont">CONTINUER · ❤️ ${META.lives}</button>${left>0?'<button class="btng" data-act="shareLives">PARTAGER → +5 ❤️</button>':''}`;
 overlay(`<div class="eyebrow">${eyebrow}</div><div class="title" style="padding:0;font-size:40px;line-height:44px">${run.toLocaleString('fr-FR')} <span style="font-size:18px;color:var(--mfg)">pts</span></div><div class="ex" style="padding:0;margin-top:6px">${over?'Score final':'Partie en cours'} · étape ${stageOf(J)+1}/${NSTAGE()} · ❤️ ${META.lives} · record ${best.toLocaleString('fr-FR')}</div><div class="lb" id="lb"><div class="ex" style="padding:0">Classement…</div></div><div class="ex" style="padding:0;margin-top:8px" id="rk"></div>${btns}`);
 sbRpc('precision_top',{n:10}).then(rows=>{const el=$('lb');if(!el)return;if(!Array.isArray(rows)||!rows.length){el.innerHTML='<div class="ex" style="padding:0">Pas encore de score au classement : termine une partie pour être le premier.</div>';return;}
  el.innerHTML='<div class="eyebrow" style="margin:6px 0 2px;font-size:11px">TOP JOUEURS</div>'+rows.map((r,i)=>`<div class="row${META.name&&r.pseudo===META.name?' me':''}"><span>${i+1}. ${String(r.pseudo).replace(/[<>&]/g,'')}</span><b>${(r.score||0).toLocaleString('fr-FR')}</b></div>`).join('');});
 if(best>0)sbRpc('precision_rank',{s:best}).then(r=>{const el=$('rk');if(el&&typeof r==='number')el.textContent=`Ta place avec ton record : #${r}`;});}
function shareChallenge(){
 if(!META.name){const n=(prompt('Ton prénom ou pseudo (ton pote verra qui le défie) :')||'').trim().slice(0,16);if(n){META.name=n;saveMeta();}}
 const t=Math.min(3,G.tier),c={g:G.id,t,s:G.score||0,n:META.name||'',r:PID};
 const url='https://jeux.eviteclux.com/1000/?c='+b64e(c);
 const text=`J'ai fait ${c.s}/1000 sur ${R[G.id].label} 🎯 Un seul doigt. Tu fais mieux ?`;
 ev('challenge_sent',{game:G.id,tier:t,err:c.s});grantShare();
 if(navigator.share){navigator.share({title:'1.000',text,url}).catch(()=>{});return;}
 const full=text+' '+url;
 if(navigator.clipboard)navigator.clipboard.writeText(full).then(()=>overlay(`<div class="eyebrow">LIEN COPIÉ</div><div class="ex" style="padding:0">Colle-le dans WhatsApp, Insta ou TikTok.</div><a class="btnp" style="display:block;text-decoration:none" href="https://wa.me/?text=${encodeURIComponent(full)}" target="_blank">ENVOYER PAR WHATSAPP</a><button class="btng" data-close>FERMER</button>`)).catch(()=>{location.href='https://wa.me/?text='+encodeURIComponent(full);});
 else location.href='https://wa.me/?text='+encodeURIComponent(full);
}
function claimRefs(){sbRpc('precision_ref_count',{p:PID}).then(n=>{if(typeof n!=='number')return;const got=Math.min(20,n),prev=META.refClaimed||0;if(got>prev){const d=got-prev;META.refClaimed=got;addLives(5*d);setNav(false);
  if($('ov').hidden)overlay(`<div class="eyebrow">TES DÉFIS MARCHENT</div><div class="title" style="padding:0">${d} pote${d>1?'s ont':' a'} relevé ton défi</div><div class="ex" style="padding:0">+${5*d} ❤️ pour toi. Chaque pote qui joue ton défi te rapporte 5 vies.</div><button class="btnp" data-close>GÉNIAL</button>`);}});}
let CH=null;
(function(){const q=new URLSearchParams(location.search).get('c');if(!q)return;const c=b64d(q);
 if(!c||!GAME_IDS.includes(c.g)||!(c.t>=1&&c.t<=3)||!(c.s>=0&&c.s<=1000))return;
 CH={g:c.g,t:c.t|0,s:Math.round(c.s),n:String(c.n||'').replace(/[<>&"]/g,'').slice(0,16),r:/^[0-9a-f-]{36}$/i.test(c.r||'')?c.r:null};
 mode='challenge';ev('challenge_open',{game:CH.g,tier:CH.t,ref:CH.r,err:CH.s});
 let gift='';if(!META.challengeGift&&CH.r!==PID){META.challengeGift=1;addLives(3);gift='<div class="ex" style="padding:0;color:var(--primary)">🎁 +3 ❤️ de bienvenue</div>';}
 setTimeout(()=>overlay(`<div class="eyebrow">ON TE DÉFIE</div><div class="title" style="padding:0">${CH.n||'Un pote'} a fait <span style="color:var(--primary)">${CH.s}/1000</span></div><div class="ex" style="padding:0">sur ${R[CH.g].label}. Un seul doigt. À toi de le battre.</div>${gift}<button class="btnp" data-close>RELEVER LE DÉFI</button>`),50);
})();
layout();setNav(false);newRound();requestAnimationFrame(frame);claimRefs();
if(lifeRefill)setTimeout(()=>toast(`❤️ ${START_LIVES} vies offertes aujourd’hui`),600);
ev('visit',{game:(new URLSearchParams(location.search).get('src')||'').replace(/[^a-z0-9_-]/gi,'').slice(0,24)||null});
window.__p={labWin(){labFinish({err:0,tol:G.thr,unit:'PX',detail:'TEST'});},get LS(){return LS},tapAfter(ms){startAt=performance.now()-ms;onTap();},get state(){return state},get G(){return G},get J(){return J},onTap,mechanicError};
})();
