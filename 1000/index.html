*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--fg);font-family:Inter,system-ui,sans-serif;overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
#app{position:fixed;inset:0;max-width:480px;margin:0 auto;background:var(--bg);transition:background .12s}
#app.perfect{background:var(--primary)}
#promo{position:absolute;top:0;left:0;right:0;z-index:60;display:flex;align-items:center;justify-content:center;gap:10px;padding:calc(var(--top) + 6px) 12px 6px;background:#16161b;border-bottom:1px solid var(--muted);font-size:11px;font-weight:700;letter-spacing:.4px}

#promo a{flex:none;background:var(--primary);color:#000;text-decoration:none;font-weight:900;padding:6px 12px;border-radius:999px;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
#surface{position:absolute;inset:0;top:var(--pt);touch-action:none}
.abs{position:absolute}
.c{position:absolute;left:50%;top:50%}

#toast.on{opacity:1}
.hudp{position:absolute;bottom:calc(18px + var(--bot));z-index:39;pointer-events:none;background:#121215;border:1px solid var(--muted);border-radius:999px;padding:7px 12px;font-weight:900;font-size:14px;color:#fff}

.lb{text-align:left;margin-top:12px}.lb .row{padding:7px 0;font-size:13px}.lb .me{color:var(--primary)}

.btnw{display:block;width:100%;margin-top:10px;background:#1c1c21;color:#fff;border:1px solid var(--muted);border-radius:12px;padding:14px;font-weight:900;font-size:14px;letter-spacing:.5px}

#home h3{color:var(--primary);font-size:12px;font-weight:900;letter-spacing:2.5px;margin:26px 0 10px}
#home .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#home .tile{background:var(--card);border:1px solid var(--muted);border-radius:14px;padding:14px 10px;text-align:left;color:#fff;font-size:13px;font-weight:800;line-height:17px;min-height:64px}
#home .tile i{display:block;font-style:normal;color:var(--primary);font-size:11px;letter-spacing:1px;margin-bottom:4px}
#home .tile.cur{border-color:var(--primary)}
#home .links{display:flex;gap:8px;margin-top:22px}
#home .links button{flex:1;border:1px solid var(--muted);border-radius:12px;padding:13px 6px;color:#fff;font-size:13px;font-weight:700}
</style>
</head>

<script>
(function(){

const HELP={
