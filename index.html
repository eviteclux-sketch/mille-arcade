<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<script>(function(){var q=location.search;if(/[?&]ref=/.test(q)){location.replace("arcade/"+q+location.hash);}})();</script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b10">
<title>Eviteclux Jeux</title>
<meta name="description" content="Deux jeux gratuits à un seul doigt : Mille Arcade et 1.000. Sans inscription, dans ton navigateur.">
<meta property="og:image" content="https://jeux.eviteclux.com/og/og-accueil.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://jeux.eviteclux.com/og/og-accueil.png">
<meta property="og:title" content="Choisis ton jeu · Eviteclux Jeux">
<meta property="og:description" content="Mille Arcade ou 1.000 : deux jeux gratuits à un seul doigt.">
<meta property="og:url" content="https://jeux.eviteclux.com/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b10;--card:#15151c;--line:#2a2a33;--ink:#fff;--muted:#8f8f99;--accent:#D4FF00}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 28px) 16px calc(env(safe-area-inset-bottom,0px) + 32px)}
.brand{font-size:12px;font-weight:900;letter-spacing:2px;color:var(--muted)}
h1{margin-top:18px;font-size:clamp(34px,10vw,48px);font-weight:900;letter-spacing:-1px;line-height:1.05}
.sub{margin-top:8px;font-size:15px;font-weight:500;color:var(--muted)}
.games{display:grid;gap:14px;margin-top:26px}
.game{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px 20px}
.game:active{transform:scale(.985)}
.name{font-size:34px;font-weight:900;letter-spacing:-.5px}
.what{margin-top:4px;font-size:15px;font-weight:500;color:var(--muted)}
.btn{margin-top:18px;display:block;text-align:center;background:var(--accent);color:#000;border-radius:14px;padding:16px;font-size:17px;font-weight:900;letter-spacing:1px}
.note{margin-top:22px;text-align:center;font-size:14px;font-weight:500;color:var(--muted)}
footer{margin-top:28px;text-align:center;font-size:11px;color:#55555f}
</style>
</head>
<body>
<main>
 <div class="brand">EVITECLUX · JEUX</div>
 <h1 data-t="h1">Choisis ton jeu</h1>
 <p class="sub" data-t="sub">Gratuit · sans inscription · un seul doigt</p>
 <div class="games">
  <a class="game" href="arcade/?src=hub" data-g="arcade">
   <div class="name">Mille Arcade</div>
   <div class="what" data-t="wA">16 jeux d’arcade</div>
   <div class="btn" data-t="play">JOUER</div>
  </a>
  <a class="game" href="1000/?src=hub" data-g="precision">
   <div class="name">1.000</div>
   <div class="what" data-t="wB">32 jeux d’adresse</div>
   <div class="btn" data-t="play">JOUER</div>
  </a>
 </div>
 <p class="note" data-t="note">Dans chaque jeu : ⚡ Défi ou 🎯 Entraînement.</p>
 <footer>jeux.eviteclux.com</footer>
</main>
<script>
(function(){
'use strict';
const EN={h1:'Pick your game',sub:'Free · no sign-up · one finger',wA:'16 arcade games',wB:'32 skill games',play:'PLAY',note:'In each game: ⚡ Challenge or 🎯 Practice.'};
const lang=(navigator.language||'fr').slice(0,2).toLowerCase();
if(lang!=='fr'){document.documentElement.lang='en';document.querySelectorAll('[data-t]').forEach(n=>{const v=EN[n.dataset.t];if(v!=null)n.textContent=v;});document.title='Eviteclux Games';}
// stats (insert-only)
const SB={url:'https://vngwxpvvlgxukkcrctly.supabase.co',key:'sb_publishable_-ylKGiCusHs1QbEglr80cQ_C_O3jHdi'};
let pid=null;try{pid=localStorage.getItem('@hub_pid');if(!pid){pid=crypto.randomUUID();localStorage.setItem('@hub_pid',pid);}}catch(e){pid=crypto.randomUUID?crypto.randomUUID():null;}
function ev(kind,game){if(!pid)return;try{fetch(SB.url+'/rest/v1/precision_events',{method:'POST',headers:{apikey:SB.key,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({player:pid,kind,game}),keepalive:true}).catch(()=>{});}catch(e){}}
const src=(new URLSearchParams(location.search).get('src')||'').replace(/[^a-z0-9_-]/gi,'').slice(0,24)||null;
ev('hub',src);
document.querySelectorAll('.game').forEach(c=>c.addEventListener('click',()=>ev('hub_click',c.dataset.g)));
})();
</script>
</body>
</html>
